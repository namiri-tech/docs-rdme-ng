        unit_price:
          type: number
          format: double
          example: 10000
          description: The cost of a single unit of the item
        currency_code:
          type: string
          example: NGN
          description: The currency in which the item is priced
        description:
          type: string
          example: Sample item description
          description: A brief description of the item
        display_name:
          type: string
          example: Digitax Product 001
          description: The name of the good or service being sold
        item_code:
          type: string
          example: '8000020107057'
          description: >-
            A unique product code assigned to the item in the user's system. It
            will be used as the unique product identifier
    Invoice:
      type: object
      description: Represents an invoice, credit note or debit note created on DigiTax
      required:
        - id
        - created_at
        - updated_at
        - active
        - party_id
        - invoice_date
        - issue_date
        - invoice_type_code
        - document_currency_code
        - tax_currency_code
        - invoice_number
        - invoice_reference_number
        - status
        - is_valid
        - line_extension_amount
        - tax_exclusive_amount
        - tax_inclusive_amount
        - payable_amount
        - tax_amount
        - items
        - transmitted_at
        - signed_at
        - validated_at
        - payment_status
      properties:
        id:
          type: string
          example: invoice_01JWBCPPJGSSPN8GAG0XC65RJK
          description: The ID of the invoice on DigiTax
        original_invoice_id:
          type: string
          example: invoice_01K0K1DKM7XJRE6Z2MH8D4NQC3
          description: >-
            The ID of the original invoice that was credited or debited on
            DigiTax if this is a credit or debit note
        created_at:
          type: string
          format: date-time
          example: '2025-08-12T04:40:57Z'
          description: The date and time when the invoice was created
        updated_at:
          type: string
          format: date-time
          example: '2025-08-12T04:40:57Z'
          description: The date and time when the invoice was last updated
        active:
          type: boolean
          example: true
          description: Indicates whether the invoice is active on the DigiTax system or not
        party_id:
          type: string
          example: party_01JWB8QHB4C1Q437MXCPR0XAZW
          description: The buyer or recipient of the goods or services
        payee_party_id:
          type: string
          example: party_01JWB8QHB4C1Q437MXCPR0XAZW
          description: >-
            If the payment goes to someone else, this field captures that
            party's ID on DigiTax
        bill_party_id:
          type: string
          example: party_01JWB8QHB4C1Q437MXCPR0XAZW
          description: >-
            If the payment goes to someone else, this field captures that
            party's ID on DigiTax
        ship_party_id:
          type: string
          example: party_01JWB8QHB4C1Q437MXCPR0XAZW
          description: >-
            If the payment goes to someone else, this field captures that
            party's ID on DigiTax
        tax_representative_party_id:
          type: string
          example: party_01JWB8QHB4C1Q437MXCPR0XAZW
          description: >-
            The party ID of the tax agent handling invoicing and compliance for
            the business if there is one
        invoice_date:
          type: string
          format: date
          example: '2025-08-07'
          description: The date on which the invoice was created in the format YYYY-MM-DD
        issue_date:
          type: string
          format: date
          example: '2025-08-07'
          description: The date on which this invoice was issued in the format YYYY-MM-DD
        issue_time:
          type: string
          format: time
          example: '17:59:04'
          description: The time at which the invoice was issued in HH:MM:SS format
        is_valid:
          type: boolean
          example: true
          description: Indicates whether the invoice payload is valid
        transmitted_at:
          type: string
          format: date-time
          nullable: true
          example: '2025-08-12T04:40:58Z'
          description: The date and time when the invoice was transmitted to the party
        signed_at:
          type: string
          format: date-time
          nullable: true
          example: '2025-08-12T04:40:58Z'
          description: The date and time when the invoice was submitted to FIRS for signing
        validated_at:
          type: string
          format: date-time
          nullable: true
          example: '2025-08-12T04:40:58Z'
          description: The date and time when the invoice payload was validated
        invoice_type_code:
          type: string
          example: '381'
          description: A code that specifies the type of the invoice
        tax_point_date:
          type: string
          format: date
          example: '2025-08-07'
          description: >-
            The actual date when the tax becomes applicable in the format
            YYYY-MM-DD
        document_currency_code:
          type: string
          example: NGN
          description: >-
            A code that specifies the default currency in which the invoice is
            issued
        tax_currency_code:
          type: string
          example: NGN
          description: The currency in which tax amounts are calculated
        invoice_number:
          type: string
          example: INV25-224-074057504-HMD2PU
          description: The unique invoice number of the invoice on DigiTax
        invoice_reference_number:
          type: string
          example: 150835152MSVKRR-E3A89069-20250528
          description: A unique tracking number assigned to each invoice on the FIRS system
        buyer_reference:
          type: string
          example: '#INV-001'
          description: >-
            A reference number or code provided by the buyer to track the
            invoice
        trader_invoice_number:
          type: string
          example: '2453618203'
          description: >-
            An invoice number assigned by the supplier to uniquely identify the
            invoice in their system
        payment_status:
          type: string
          example: PENDING
          enum:
            - PENDING
            - REJECTED
            - PAID
          description: Indicates whether the invoice has been paid or is still pending
        delivery_date:
          type: string
          format: date
          example: '2025-08-07'
          description: The date on which the goods or services were delivered
        status:
          type: string
          enum:
            - DRAFT
            - PENDING
            - CONFIRMED
            - FAILED
            - COMPLETED
          example: COMPLETED
          description: The current status of the invoice
        line_extension_amount:
          type: number
          format: double
          example: 10000
          description: >-
            The total amount of all invoice items before tax and any discounts
            or charges
        tax_exclusive_amount:
          type: number
          format: double
          example: 9700
          description: The total invoice amount before tax is added
        tax_inclusive_amount:
          type: number
          format: double
          example: 10427.5
          description: The total invoice amount after tax is added
        payable_amount:
          type: number
          format: double
          example: 10427.5
          description: >-
            The final amount the buyer must pay after applying discounts,
            charges and tax
        tax_amount:
          type: number
          format: double
          example: 727.5
          description: The total tax amount applied to the invoice
        accounting_cost:
          type: string
          example: 2000 NGN
          description: >-
            Represents the accounting category or cost center assigned to the
            transaction
        payment_terms_note:
          type: string
          example: Payment due within 30 days of invoice issue
          description: Describes the terms and conditions of payment
        invoice_delivery_period:
          $ref: '#/components/schemas/DeliveryPeriod'
          description: >-
            Defines the start and end dates for when goods or services were
            delivered. This helps track multi-day deliveries on a single invoice
        payment_means:
          type: array
          description: Defines how the invoice will be paid and when payment is due
          items:
            $ref: '#/components/schemas/PaymentMeans'
        allowance_charge:
          type: array
          description: Defines any discounts (allowance) or extra charges (charge)
          items:
            $ref: '#/components/schemas/AllowanceCharge'
        billing_reference:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceDocumentReference'
          description: >-
            A list of references to previous billing documents associated with
            the invoice (e.g., credit notes, debit notes, or prior invoices)
        dispatch_document_reference:
          $ref: '#/components/schemas/InvoiceDocumentReference'
          description: >-
            An optional identifier of a referenced dispatch advice. Refers to
            the document used to track the dispatch of goods
        receipt_document_reference:
          $ref: '#/components/schemas/InvoiceDocumentReference'
          description: >-
            A reference to a receipt advice associated with an invoice. Links
            the invoice to a receipt document
        originator_document_reference:
          $ref: '#/components/schemas/InvoiceDocumentReference'
          description: >-
            A reference to an originator document associated with an invoice.
            Identifies the original document that initiated the invoice
        contract_document_reference:
          $ref: '#/components/schemas/InvoiceDocumentReference'
          description: >-
            A reference to a contract associated with an invoice. Links the
            invoice to a contract governing the transaction
        additional_document_reference:
          type: array
          description: >-
            A reference to additional documents associated with an invoice. Used
            as a general reference field for any related documents
          items:
            $ref: '#/components/schemas/InvoiceDocumentReference'
        due_date:
          type: string
          format: date
          example: '2025-08-07'
          description: >-
            The date on which the invoice is due for payment in the format
            YYYY-MM-DD
        notes:
          type: string
          example: Sample invoice notes
          description: >-
            Additional invoice information that is not contained explicitly in
            other structures
        qr_code_data:
          type: string
          description: Encrypted QR code data from FIRS
          example: iVBORw0KGgoAAAANSUhEUgAA...
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/TaxBreakdown'
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
    InvoiceItem:
