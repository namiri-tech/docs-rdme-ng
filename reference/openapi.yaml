components:
  schemas:
    Success:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    Error:
      type: object
      required:
        - message
        - code
      properties:
        message:
          type: string
        code:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    FetchMeta:
      type: object
      required:
        - last_updated
      properties:
        last_updated:
          type: string
          example: '2023-02-02T21:00:00.000Z'
          description: Timestamp when the data was last updated from eTIMS
    Notice:
      type: object
      required:
        - id
        - notice_number
        - notice_date
        - title
        - detail
        - by
        - link
      properties:
        id:
          type: string
          example: notice_01HC3J1VVVM05YCTS61G7V3KC6
          description: Notice ID in Digitax
        notice_number:
          type: string
          example: 01HC3J1VVVM05YCTS61G7V3KC6
          description: Notice number from eTIMS
        notice_date:
          type: string
          example: '2023-02-02T21:00:00.000Z'
        title:
          type: string
          example: Call to Action
        detail:
          type: string
          example: Call to Action
        by:
          type: string
          example: KENYA REVENUE AUTHORITY
        link:
          type: string
          example: https://etims.kra.go.ke
    Branch:
      type: object
      required:
        - tax_pin
        - branch_office_id
        - branch_office_name
        - branch_status_code
        - county_name
        - sub_county_name
        - tax_locality_name
        - location_description
        - manager_name
        - manager_contact
        - manager_email
        - business_id
      properties:
        id:
          type: string
          example: branch_01HC3J1VVVM05YCTS61G7V3KC6
        tax_pin:
          type: string
          description: Branch KRA PIN
          example: P012345678P
        branch_office_id:
          type: string
          description: Branch Office ID
          example: 0
        branch_office_name:
          type: string
          description: Branch Office Name
          example: Head Office
        branch_status_code:
          type: string
          description: Branch Status Code
          example: 1
        county_name:
          type: string
          description: County Name
          example: Nairobi
        sub_county_name:
          type: string
