                items:
                  type: array
                  items:
                    type: object
                    required:
                      - item_code
                      - quantity
                      - unit_price
                      - tax_rate
                    properties:
                      item_code:
                        type: string
                        example: '8000020107057'
                        description: >-
                          A unique product code assigned to the item in the
                          user's system. It will be used as the unique product
                          identifier
                      quantity:
                        type: number
                        format: double
                        example: 1
                        minimum: 0
                        description: The total number of items being debited
                      unit_price:
                        type: number
                        format: double
                        example: 10000
                        minimum: 0
                        description: The unit price of this line item before tax
                      discount_rate:
                        type: number
                        format: double
                        example: 0.05
                        minimum: 0
                        maximum: 1
                        description: >-
                          The discount rate applied to the item. It must be a
                          value between 0 and 1, where 0 means no discount and 1
                          means a 100% discount
                      fee_rate:
                        type: number
                        format: double
                        example: 0.02
                        minimum: 0
                        maximum: 1
                        description: >-
                          The rate of any additional fees (e.g. service charge,
                          delivery fee).  It must be a value between 0 and 1,
                          where 0 means no fee and 1 means a 100% fee on the
                          price
                      tax_rate:
                        type: number
                        format: double
                        example: 0.075
                        minimum: 0
                        maximum: 1
                        description: >-
                          The tax rate applied to the item. It must be a value
                          between 0 and 1. For tax category codes that already
                          have a defined tax rate, this value must match the tax
                          category's tax rate
                      taxable_amount:
                        type: number
                        format: double
                        example: 9700
                        minimum: 0
                        description: >-
                          The amount on which tax is calculated. It must be
                          equal to the line extension amount (unit price *
                          quantity) plus fees minus discounts. This value will
                          be ignored unless the business has the permission to
                          calculate tax
                      tax_amount:
                        type: number
                        format: double
                        example: 727.5
                        minimum: 0
                        description: >-
                          The tax amount for this line item. It must be equal to
                          the taxable amount multiplied by the tax rate. This
                          value will be ignored unless the business has the
                          permission to calculate tax
                      item_description:
                        type: string
                        example: Sample item description
                        description: A brief description of the item being sold
      responses:
        '201':
          description: Debit note created
          content:
            application/json:
              schema:
