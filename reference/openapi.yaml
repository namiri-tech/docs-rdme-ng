        - product_category
        - item_name
        - hsn_code
        - item_number
        - unit_price
        - currency_code
        - description
      properties:
        id:
          type: string
          example: item_01JWBBCVSHK3ZQAVNPW2MPSQXS
          description: The ID of the item on DigiTax
        created_at:
          type: string
          format: date-time
          example: '2025-08-12T04:40:57Z'
          description: The date and time when the item was created
        updated_at:
          type: string
          format: date-time
          example: '2025-08-12T04:40:57Z'
          description: The date and time when the item was last updated
        active:
          type: boolean
          example: true
          description: Indicates whether the item is active on the DigiTax system or not
        tax_category_code:
