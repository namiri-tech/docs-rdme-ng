  /app-invoices:
    post:
      tags:
        - APP Invoices
      summary: >-
        Create Invoice by users who are using DigiTax as their Access Point
        Provider(APP) only
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - irn
                - issue_date
                - invoice_type_code
                - document_currency_code
                - tax_currency_code
                - accounting_supplier_party
                - invoice_line
                - tax_total
                - legal_monetary_total
              properties:
                irn:
                  type: string
                  example: 150835152MSVKRR-E3A89069-20250528
                  description: >-
                    A unique tracking number assigned to each invoice on the
                    FIRS system
                payment_status:
                  type: string
                  example: PENDING
                  enum:
                    - PENDING
                    - REJECTED
                    - PAID
                  description: >-
                    Indicates whether the invoice has been paid or is still
                    pending
                issue_date:
                  type: string
                  format: date
                  example: '2025-09-12'
                  description: >-
                    The date on which this invoice was issued in the format
                    YYYY-MM-DD
                issue_time:
                  type: string
                  example: '17:59:04'
                  format: time
                  description: The time at which the invoice was issued in HH:MM:SS format
                due_date:
                  type: string
                  format: date
                  example: '2025-09-12'
                  description: >-
                    The date on which the invoice is due for payment in the
                    format YYYY-MM-DD
                invoice_type_code:
                  type: string
                  example: '381'
                  description: A code that specifies the type of invoice being issued
                tax_point_date:
                  type: string
                  format: date
                  example: '2025-09-12'
                  description: >-
                    The actual date when the tax becomes applicable in the
                    format YYYY-MM-DD
                document_currency_code:
                  type: string
                  example: NGN
                  description: >-
                    A code that specifies the default currency in which the
                    invoice is issued
                tax_currency_code:
                  type: string
                  example: NGN
                  description: The currency in which tax amounts are calculated
                accounting_cost:
                  type: string
                  example: '2000'
                  description: >-
                    Represents the accounting category or cost center assigned
                    to the transaction
                note:
                  type: string
                  example: Sample invoice notes
                  description: >-
                    Additional invoice information that is not contained
                    explicitly in other structures
                buyer_reference:
                  type: string
                  example: '#INV-001'
                  description: >-
                    A reference number or code provided by the buyer to track
                    the invoice
                order_reference:
                  type: string
                  example: 150835152MSVKRR-E3A89069-20250401
                  description: The order number tied to an invoice
                actual_delivery_date:
                  type: string
                  format: date
                  example: '2025-09-12'
                  description: The date the goods or services were delivered
                payment_terms_note:
                  type: string
                  example: Payment due within 30 days of invoice issue
                  description: Describes the terms and conditions of payment
                invoice_delivery_period:
                  $ref: '#/components/schemas/DeliveryPeriod'
                  description: >-
                    Defines the start and end dates for when goods or services
                    were delivered. This helps track multi-day deliveries on a
                    single invoice
                allowance_charge:
                  type: array
                  description: Defines any discounts (allowance) or extra charges (charge)
                  items:
                    $ref: '#/components/schemas/AllowanceCharge'
                invoice_line:
                  type: array
                  description: >-
                    It captures details about each item or service being
                    invoiced
                  items:
                    $ref: '#/components/schemas/LineItem'
                tax_total:
                  type: array
                  description: The total tax charged on the invoice
                  items:
                    $ref: '#/components/schemas/TaxTotal'
                accounting_customer_party:
                  $ref: '#/components/schemas/APPInvoiceParty'
                  description: The buyer or recipient of the goods or services
                accounting_supplier_party:
                  $ref: '#/components/schemas/APPInvoiceParty'
                  description: The seller or supplier issuing the invoice
                bill_party:
                  $ref: '#/components/schemas/APPInvoiceParty'
                  description: >-
                    If the payment goes to someone else, this field captures
                    that entity's details
                ship_party:
                  $ref: '#/components/schemas/APPInvoiceParty'
                  description: >-
                    If the payment goes to someone else, this field captures
                    that entity's details
                payee_party:
                  $ref: '#/components/schemas/APPInvoiceParty'
                  description: >-
                    If the payment goes to someone else, this field captures
                    that entity's details
                tax_representative_party:
                  $ref: '#/components/schemas/APPInvoiceParty'
                  description: >-
                    If a business has a tax agent handling invoicing and
                    compliance, their details are entered here
                billing_reference:
                  type: array
                  description: >-
                    A list of references to previous billing documents
                    associated with the invoice (e.g., credit notes, debit
                    notes, or prior invoices)
                  items:
                    $ref: '#/components/schemas/InvoiceDocumentReference'
                dispatch_document_reference:
                  $ref: '#/components/schemas/InvoiceDocumentReference'
                  description: >-
                    An optional identifier of a referenced dispatch advice.
                    Refers to the document used to track the dispatch of goods
                receipt_document_reference:
                  $ref: '#/components/schemas/InvoiceDocumentReference'
                  description: >-
                    A reference to a receipt advice associated with an invoice.
                    Links the invoice to a receipt document
                originator_document_reference:
                  $ref: '#/components/schemas/InvoiceDocumentReference'
                  description: >-
                    A reference to an originator document associated with an
                    invoice. Identifies the original document that initiated the
                    invoice
                contract_document_reference:
                  $ref: '#/components/schemas/InvoiceDocumentReference'
                  description: >-
                    A reference to a contract associated with an invoice. Links
                    the invoice to a contract governing the transaction
                additional_document_reference:
                  type: array
                  description: >-
                    A reference to additional documents associated with an
                    invoice. Used as a general reference field for any related
                    documents
                  items:
                    $ref: '#/components/schemas/InvoiceDocumentReference'
                payment_means:
                  type: array
                  description: Defines how the invoice will be paid and when payment is due
                  items:
                    $ref: '#/components/schemas/PaymentMeans'
                legal_monetary_total:
                  $ref: '#/components/schemas/LegalMonetaryTotal'
                  description: >-
