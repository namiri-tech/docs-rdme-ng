components:
  schemas:
    Country:
      type: object
      required:
        - name
        - alpha2
        - alpha3
      properties:
        name:
          type: string
          example: Nigeria
        alpha2:
          type: string
          example: NG
        alpha3:
          type: string
          example: NGA
    Currency:
      type: object
      required:
        - symbol
        - name
        - symbolNative
        - decimalDigits
        - rounding
        - code
        - namePlural
      properties:
        symbol:
          type: string
          example: ₦
        name:
          type: string
          example: Nigerian Naira
        symbolNative:
          type: string
          example: ₦
        decimalDigits:
          type: integer
          example: 2
        rounding:
          type: integer
          example: 0
        code:
          type: string
          example: NGN
        namePlural:
          type: string
          example: Nigerian nairas
    TaxCategory:
      type: object
      description: Represents a tax category as is defined by FIRS
      required:
        - code
        - name
        - has_rate
        - tax_rate
      properties:
        code:
          type: string
          example: STANDARD_VAT
          description: The code representing the tax category
        name:
          type: string
          example: Standard Value-Added Tax
          description: The name of the tax category
        tax_rate:
          type: number
          format: double
          example: 0.075
          nullable: true
          description: >-
            The tax rate(between 0 and 1) applied to the category for tax
            categories that have a defined rate
        has_rate:
          type: boolean
          example: true
          description: Indicates whether the tax category has a rate defined
    CommonCode:
      type: object
      required:
        - code
        - value
      properties:
        code:
          type: string
          example: '389'
        value:
          type: string
          example: Purchase Order
    Address:
      type: object
      description: Represents the address of the taxpayer
      required:
        - street_name
        - city_name
        - postal_zone
        - country_code
      properties:
        street_name:
          type: string
          example: 123 Main St
          description: The street name where the buyer's business is located
        city_name:
          type: string
          example: Lagos
          description: The city where the buyer's business is registered
        postal_zone:
          type: string
          example: '100001'
          description: The postal code of the buyer's business location
        country_code:
          type: string
          example: NGA
          description: The country code representing the buyer's registered country
    Branch:
      type: object
      required:
        - id
        - created_at
        - updated_at
        - active
        - is_test
        - tax_identification_number
        - address
        - taxpayer_name
        - taxpayer_email
      properties:
        id:
          type: string
          example: branch_01HC3J1VVVM05YCTS61G7V3KC6
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        active:
          type: boolean
        is_test:
          type: boolean
        service_id:
          type: string
          example: E3B89060
        taxpayer_id:
          type: string
          example: 3dce1631-9169-49d7-b1e9-37f081a42962
        taxpayer_name:
          type: string
          example: John Doe
        taxpayer_email:
          type: string
          example: john@doe.com
        tax_identification_number:
          type: string
          example: 08289985-9146
        address:
          $ref: '#/components/schemas/Address'
    Party:
      type: object
      description: The buyer or recipient of goods or services
      required:
        - id
        - created_at
        - updated_at
        - active
