        discount_amount:
          type: number
          format: double
          example: 500
          description: >-
            The actual discount value in currency applied to the item based on
            the discount rate
        fee_amount:
          type: number
          format: double
          example: 200
          description: The actual fee charged in currency based on the fee rate
        product_category:
          type: string
          example: Food and Beverages
          description: The category the product belongs to
        item_name:
          type: string
          example: Digitax Product 001
          description: The name of the good or service being sold
        hsn_code:
          type: string
          example: '2847.00'
          description: >-
            The Harmonized System of Nomenclature (HSN) Code for the product. <a
            href="https://ng.docs.digitax.tech/reference/reference-hs-hsn-code-files#/">HSN
            Reference</a>
        description:
          type: string
          example: Sample item description
          description: A brief description of the item
        sellers_item_identification:
          type: string
          example: Sample item sellers item identification
          description: An identifier for the item as assigned by the seller
        service_category:
          type: string
          example: Construction of buildings
          description: The category the service belongs to
        isic_code:
          type: string
          example: '4100'
          description: >-
            The International Standard Industry Classification (ISIC) code for
            the product
    APPInvoice:
      type: object
      required:
        - id
        - irn
        - issue_date
        - invoice_type_code
        - document_currency_code
        - tax_currency_code
        - accounting_supplier_party
        - invoice_line
        - tax_total
        - legal_monetary_total
        - created_at
        - updated_at
        - active
        - payment_status
        - is_valid
        - transmitted_at
        - signed_at
        - validated_at
      properties:
        id:
          type: string
          example: appinvoice_01K4Q9TGAQNQ5A5FW0WJ9WHPH1
          description: The ID of the invoice on DigiTax
        irn:
          type: string
          example: 150835152MSVKRR-E3A89069-20250528
          description: A unique tracking number assigned to each invoice on the FIRS system
        payment_status:
          type: string
          example: PENDING
          enum:
            - PENDING
            - REJECTED
            - PAID
          description: Indicates whether the invoice has been paid or is still pending
        issue_date:
          type: string
          format: date
          example: '2025-09-12'
          description: The date on which this invoice was issued in the format YYYY-MM-DD
        issue_time:
          type: string
          format: time
          example: '17:59:04'
          description: The time at which the invoice was issued in HH:MM:SS format
        due_date:
          type: string
          format: date
          example: '2025-09-12'
          description: >-
            The date on which the invoice is due for payment in the format
            YYYY-MM-DD
        invoice_type_code:
          type: string
          example: '381'
          description: A code that specifies the type of invoice being issued
        tax_point_date:
          type: string
          format: date
          example: '2025-09-12'
          description: >-
            The actual date when the tax becomes applicable in the format
            YYYY-MM-DD
        document_currency_code:
          type: string
          example: NGN
          description: >-
            A code that specifies the default currency in which the invoice is
            issued
        tax_currency_code:
          type: string
          example: NGN
          description: The currency in which tax amounts are calculated
        accounting_cost:
          type: string
          example: '2000'
          description: >-
            Represents the accounting category or cost center assigned to the
            transaction
        note:
          type: string
          example: Sample invoice notes
          description: >-
            Additional invoice information that is not contained explicitly in
            other structures
        buyer_reference:
          type: string
          example: '#INV-001'
          description: >-
            A reference number or code provided by the buyer to track the
            invoice
        order_reference:
          type: string
          example: 150835152MSVKRR-E3A89069-20250401
          description: The order number tied to an invoice
        actual_delivery_date:
          type: string
          format: date
          example: '2025-09-12'
          description: The date the goods or services were delivered
        payment_terms_note:
          type: string
          example: Payment due within 30 days of invoice issue
          description: Describes the terms and conditions of payment
        invoice_delivery_period:
          $ref: '#/components/schemas/DeliveryPeriod'
          description: >-
            Defines the start and end dates for when goods or services were
            delivered. This helps track multi-day deliveries on a single invoice
        allowance_charge:
          type: array
          description: Defines any discounts (allowance) or extra charges (charge)
          items:
            $ref: '#/components/schemas/AllowanceCharge'
        invoice_line:
          type: array
          description: It captures details about each item or service being invoiced
          items:
            $ref: '#/components/schemas/LineItem'
        tax_total:
          type: array
          description: The total tax charged on the invoice
          items:
            $ref: '#/components/schemas/TaxTotal'
        accounting_customer_party:
          $ref: '#/components/schemas/APPInvoiceParty'
          description: The buyer or recipient of the goods or services
        accounting_supplier_party:
          $ref: '#/components/schemas/APPInvoiceParty'
          description: The seller or supplier issuing the invoice
        bill_party:
          $ref: '#/components/schemas/APPInvoiceParty'
          description: >-
            If the payment goes to someone else, this field captures that
            entity's details
        ship_party:
          $ref: '#/components/schemas/APPInvoiceParty'
          description: >-
            If the payment goes to someone else, this field captures that
            entity's details
        payee_party:
          $ref: '#/components/schemas/APPInvoiceParty'
          description: >-
            If the payment goes to someone else, this field captures that
            entity's details
        tax_representative_party:
          $ref: '#/components/schemas/APPInvoiceParty'
          description: >-
            If a business has a tax agent handling invoicing and compliance,
            their details are entered here
        billing_reference:
          type: array
          description: >-
            A list of references to previous billing documents associated with
            the invoice (e.g., credit notes, debit notes, or prior invoices)
          items:
            $ref: '#/components/schemas/InvoiceDocumentReference'
        dispatch_document_reference:
          $ref: '#/components/schemas/InvoiceDocumentReference'
          description: >-
            An optional identifier of a referenced dispatch advice. Refers to
            the document used to track the dispatch of goods
        receipt_document_reference:
          $ref: '#/components/schemas/InvoiceDocumentReference'
          description: >-
            A reference to a receipt advice associated with an invoice. Links
            the invoice to a receipt document
        originator_document_reference:
          $ref: '#/components/schemas/InvoiceDocumentReference'
          description: >-
            A reference to an originator document associated with an invoice.
            Identifies the original document that initiated the invoice
        contract_document_reference:
          $ref: '#/components/schemas/InvoiceDocumentReference'
          description: >-
            A reference to a contract associated with an invoice. Links the
            invoice to a contract governing the transaction
        additional_document_reference:
          type: array
          description: >-
            A reference to additional documents associated with an invoice. Used
            as a general reference field for any related documents
          items:
            $ref: '#/components/schemas/InvoiceDocumentReference'
        payment_means:
          type: array
          description: Defines how the invoice will be paid and when payment is due
          items:
            $ref: '#/components/schemas/PaymentMeans'
        legal_monetary_total:
          $ref: '#/components/schemas/LegalMonetaryTotal'
          description: >-
            The total amount the buyer has to pay, including or excluding taxes.
            It ensures that the buyer knows exactly how much to pay, whether
            taxes are included or not
        callback_url:
          type: string
          format: uri
          example: https://example.com/callback
          description: >-
            The URL to call when we have new information about the debit note,
            when the invoice is signed successfully or validation has failed
        is_valid:
          type: boolean
          example: true
          description: Indicates whether the invoice payload is valid
        created_at:
          type: string
          format: date-time
          example: '2025-08-12T04:40:57Z'
          description: The date and time when the invoice was created
        updated_at:
          type: string
          format: date-time
          example: '2025-08-12T04:40:57Z'
          description: The date and time when the invoice was last updated
        transmitted_at:
          type: string
          format: date-time
          nullable: true
          example: '2025-08-12T04:40:58Z'
          description: The date and time when the invoice was transmitted to the party
        signed_at:
          type: string
          format: date-time
          nullable: true
          example: '2025-08-12T04:40:58Z'
          description: The date and time when the invoice was submitted to FIRS for signing
        validated_at:
          type: string
          format: date-time
          nullable: true
          example: '2025-08-12T04:40:58Z'
          description: The date and time when the invoice payload was validated
        active:
          type: boolean
          example: true
          description: Indicates whether the invoice is active on the DigiTax system or not
    APPInvoiceParty:
      type: object
      required:
        - tin
        - party_name
        - telephone
        - email
        - postal_address
      properties:
        tin:
          type: string
          example: 08289985-9145
          description: The Taxpayer Identification Number (TIN) assigned to the taxpayer
        party_name:
          type: string
          example: John Doe
          description: The official business or individual name of the taxpayer
        telephone:
          type: string
          example: '+2341234567890'
          description: >-
            The buyer's contact number with the country code prefix (+234 for
            Nigeria)
        email:
          type: string
          example: john@doe.com
          description: >-
            The buyer's official email address used for communication regarding
            invoices and tax compliance
        postal_address:
          $ref: '#/components/schemas/InvoiceAddress'
        business_description:
          type: string
          example: Construction and real estate
          description: A brief description of the business's line of business
    DeliveryPeriod:
      type: object
      required:
        - start_date
        - end_date
      properties:
        start_date:
          type: string
          format: date
          example: '2025-09-12'
          description: The start date of the delivery period in YYYY-MM-DD format
        end_date:
          type: string
          format: date
          example: '2025-09-12'
          description: The end date of the delivery period in YYYY-MM-DD format
    AllowanceCharge:
      type: object
      required:
        - amount
        - charge_indicator
      properties:
        charge_indicator:
          type: boolean
          example: true
          description: Indicates if the entry is a charge (true) or an allowance (false)
        amount:
          type: number
          format: double
          example: 800.6
          description: Amount of the charge or allowance
    TaxTotal:
      type: object
      required:
        - tax_amount
        - tax_subtotal
      properties:
        tax_amount:
          type: number
          format: double
          example: 56.07
          description: The total tax charged on the invoice
        tax_subtotal:
          type: array
          description: This section breaks down the tax into different tax categories
          items:
            $ref: '#/components/schemas/TaxSubtotal'
    TaxSubtotal:
      type: object
      required:
        - taxable_amount
        - tax_amount
        - tax_category
      properties:
        taxable_amount:
          type: number
          format: double
          example: 800
          description: The total value of goods/services on which tax is calculated
        tax_amount:
          type: number
          format: double
          example: 8
          description: The actual tax applied on the taxable amount
        tax_category:
          $ref: '#/components/schemas/InvoiceTaxCategory'
          description: Specifies what type of tax is applied to this subtotal
    InvoiceTaxCategory:
      type: object
      required:
        - id
        - percent
      properties:
        id:
          type: string
          example: LOCAL_SALES_TAX
          description: The tax category code that the tax subtotal applies to
        percent:
          type: number
          format: double
          example: 2.3
          description: >-
            The tax rate applied to the taxable amount, expressed as a
            percentage
    LegalMonetaryTotal:
      type: object
      required:
        - line_extension_amount
        - tax_exclusive_amount
        - tax_inclusive_amount
        - payable_amount
      properties:
        line_extension_amount:
          type: number
          format: double
          example: 340.5
          description: >-
            The total amount of all invoice items before tax and any discounts
            or charges
        tax_exclusive_amount:
          type: number
          format: double
          example: 400
          description: The total invoice amount before tax is added
        tax_inclusive_amount:
          type: number
          format: double
          example: 430
          description: The total invoice amount after tax is added
        payable_amount:
          type: number
          format: double
          example: 30
          description: >-
            The final amount the buyer must pay after applying discounts,
            charges and tax
    LineItem:
      type: object
      required:
        - hsn_code
        - product_category
        - invoiced_quantity
        - line_extension_amount
        - item
        - price
        - discount_rate
        - discount_amount
        - fee_rate
        - fee_amount
      properties:
        hsn_code:
          type: string
          example: CC-001
          description: >-
            The Harmonized System of Nomenclature (HSN) Code for the product. <a
            href="https://ng.docs.digitax.tech/reference/reference-hs-hsn-code-files#/">HSN
            Reference</a>
        product_category:
          type: string
          example: Food and Beverages
          description: The category the product belongs to
        discount_rate:
          type: number
          format: double
          example: 2
          description: The percentage discount applied to the item
        discount_amount:
          type: number
          format: double
          example: 20
          description: The actual discount value in currency applied to the item
        fee_rate:
          type: number
          format: double
          example: 3
          description: >-
            The percentage of any additional fees (e.g., service charge,
            delivery fee)
        fee_amount:
          type: number
          format: double
          example: 30
          description: The actual fee charged in currency based on the fee rate
        invoiced_quantity:
          type: number
          format: double
          example: 15
          description: The total number of items sold in the invoice line
        line_extension_amount:
          type: number
          format: double
          example: 30
          description: The total amount for this line item before tax
        item:
          $ref: '#/components/schemas/LineItemDetail'
          description: The details of the item/service being sold
        price:
          $ref: '#/components/schemas/LineItemPrice'
          description: The cost of a single unit of the item
        service_category:
          type: string
          example: Construction of buildings
          description: The category the service belongs to
        isic_code:
          type: string
          example: '4100'
          description: >-
            The International Standard Industry Classification (ISIC) code for
            the product
    LineItemDetail:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          example: Digitax Product 001
          description: The name of the good or service being sold
        description:
          type: string
          example: Sample item description
          description: A brief description of the item
        sellers_item_identification:
          type: string
          example: Identified as spoon by the seller
          description: An identifier for the item as assigned by the seller
    LineItemPrice:
      type: object
      required:
        - price_amount
        - base_quantity
        - price_unit
      properties:
        price_amount:
          type: number
          format: double
          example: 10
          description: The cost of one unit of the item
        base_quantity:
          type: number
          format: double
          example: 1
          description: The quantity that corresponds to the price amount
        price_unit:
          type: string
          example: NGN per 1
          description: Specifies the unit of measurement for the item price
    PaymentMeans:
      type: object
      required:
        - payment_means_code
        - payment_due_date
      properties:
        payment_means_code:
          type: string
          example: '49'
          description: The code that specifies the method of payment
        payment_due_date:
          type: string
          format: date
          example: '2024-05-14'
          description: The date when the payment is due in YYYY-MM-DD format
    InvoiceAddress:
      type: object
      description: Represents the address of the taxpayer
      required:
        - street_name
        - city_name
        - postal_zone
        - country
      properties:
        street_name:
          type: string
          example: 123 Main St
          description: The street name where the buyer's business is located
        city_name:
          type: string
          example: Lagos
          description: The city where the buyer's business is registered
        postal_zone:
          type: string
          example: '100001'
          description: The postal code of the buyer's business location
        country:
          type: string
          example: NG
          description: The Alpha2 country code representing the buyer's registered country
  parameters:
    After:
      in: query
      name: after
      required: false
      schema:
        type: string
        description: >-
          When paginating results, a pointer to an ID after which we want
          results
        example: item_01HC3J1VVVM05YCTS61G7V3KC6
    Before:
      in: query
      name: before
      required: false
      schema:
        type: string
        description: >-
          When paginating results, a pointer to an ID before which we want
          results
        example: item_01HC3J1VVVM05YCTS61G7V3KC6
    PageSize:
      in: query
      name: page_size
      required: false
      schema:
        type: integer
        maximum: 20
        minimum: 1
        description: The maximum number of items to return per page, defaults to 20
        example: 20
  responses:
    default:
      $ref: '#/components/responses/Error'
    Error:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            required:
              - message
              - code
            properties:
              message:
                type: string
              code:
                type: string
              metadata:
                type: object
                additionalProperties:
                  type: string
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
