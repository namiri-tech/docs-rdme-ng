openapi: 3.0.1
info:
  title: DigiTax Kenya API
  description: DigiTax Kenya Public API
  version: '3'
  termsOfService: https://digitax.tech/page/terms
  contact:
    name: DigiTax
    url: https://digitax.tech
    email: info@digitax.tech
  license:
    name: Apache 2.0
servers:
  - url: https://api.digitax.tech/ke/v2
    description: API
paths:
  /etims-info:
    get:
      summary: Get eTIMS information on the business
      tags:
        - Businesses
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /branches:
    get:
      summary: Get a list of business branches
      tags:
        - Businesses
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items:
    post:
      tags:
        - Items
      summary: Create an item
      description: Create an item
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_class_code
                - item_type_code
                - item_name
                - origin_nation_code
                - package_unit_code
                - quantity_unit_code
                - tax_type_code
                - default_unit_price
              properties:
                item_class_code:
                  type: string
                  description: The item class code of the item
                  example: 99020000
                item_type_code:
                  type: string
                  description: The item type code of the item
                  example: 3
                item_name:
                  type: string
                  description: The name of the item
                  example: DigiTax Product 01
                origin_nation_code:
                  type: string
                  description: The country of origin code of the item
                  example: KE
                package_unit_code:
                  type: string
                  description: The package unit code of the item
                  example: NT
                quantity_unit_code:
                  type: string
                  description: The quantity unit code of the item
                  example: U
                tax_type_code:
                  type: string
                  description: The tax type code of the item
                  example: D
                default_unit_price:
                  type: number
                  description: The default price of the item
                  example: 1000
                stock_quantity:
                  type: number
                  description: The starting stock quantity of the item.
                  example: 100
                callback_url:
                  type: string
                  description: >-
                    The callback url to call when we have new information about
                    the item, usually after syncing with eTIMS
                  example: https://example.site/services/digitaxQueueReceiverPROXY
                item_bar_code:
                  type: string
                  description: The bar code of the item
                  example: 0799439112766 (EAN-13 barcode)
                levies:
                  type: array
                  items:
                    type: string
                    description: List of levies applied to the sale
                    example: CTL
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Items
      summary: Get list of items owned by the business
      description: Get list of items owned by the business
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{item_id}:
    parameters:
      - in: path
        name: item_id
        required: true
        description: Item ID in Digitax
        schema:
          type: string
          example: item_01HC3J1VVVM05YCTS61G7V3KC6
    put:
      tags:
        - Items
      summary: Update an item
      description: Update an item
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_name:
                  type: string
                  description: The name of an item
                  example: DigiTax Product 02
                tax_type_code:
                  type: string
                  description: The tax type code of the item
                  example: A
                default_unit_price:
                  type: number
                  description: The default price of the item
                  example: 1000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Items
      summary: Get a specific item
      description: Get a specific item
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers:
    get:
      tags:
        - Customers
      summary: Get a list of business customers
      description: Get a list of business customers
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Customers
      summary: Save business customer
      description: Save business customer
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_name
                - customer_tin
              properties:
                customer_name:
                  type: string
                  description: Customer Name
                  example: John Doe
                customer_tin:
                  type: string
                  description: Customer Tax Identification Number (TIN)
                  example: P012345678P
                email:
                  type: string
                  description: Customer Email Address
                  example: john@doe.com
                phone:
                  type: string
                  description: Customer Phone Number
                  example: 254712345678
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers/{customer_id}:
    get:
      tags:
        - Customers
      summary: Get a business customer
      description: Retrieves information about a customer given their ID on DigiTax
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: string
            description: Customer ID on DigiTax
            example: customer_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Customers
      summary: Update a business customer
      description: Update a business customer
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: string
            description: Customer ID on DigiTax
            example: customer_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_name
                - customer_tin
              properties:
                customer_name:
                  type: string
                  description: Customer Name
                  example: John Doe
                email:
                  type: string
                  description: Customer Email Address
                  example: john@doe.com
                phone:
                  type: string
                  description: Customer Phone Number
                  example: 254712345678
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports:
    get:
      tags:
        - Imports
      summary: Get list of import items received from eTIMS
      description: Get list of import items received from eTIMS
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - meta
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/FetchMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Import'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{import_id}/link:
    put:
      tags:
        - Imports
      summary: Link import item to an item in Digitax
      description: Link import item to an item in Digitax
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: import_id
          required: true
          schema:
            type: string
            description: Import ID in Digitax
            example: import_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_id
              properties:
                item_id:
                  type: string
                  description: The id of the item in Digitax
                  example: item_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases:
    get:
      tags:
        - Purchases
      summary: Get list of purchases pulled from eTIMS.
      description: Get list of purchases pulled from eTIMS.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                  - meta
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/FetchMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases/{purchase_id}:
    get:
      tags:
        - Purchases
      summary: Get specific purchase
      description: Get specific purchase
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          schema:
            type: string
            description: Purchase ID in Digitax
            example: purchase_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases/{purchase_id}/link-items:
    post:
      tags:
        - Purchases
      summary: Link purchase item to item
      description: Link purchase item to item
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          schema:
            type: string
            description: Purchase id
            example: purchase_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - purchase_item_id
                      - item_id
                    properties:
                      purchase_item_id:
                        type: string
                        example: purchaseitem_01HC3J1VVVM05YCTS61G7V3KC6
                      item_id:
                        type: string
                        example: item_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sales:
    post:
      tags:
        - Sales
      summary: Add sale
      description: Add sale
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trader_invoice_number
                - payment_type_code
                - invoice_status_code
                - items
                - sale_date
              properties:
                sale_date:
                  type: string
                  example: '2023-07-23'
                customer_tin:
                  type: string
                  example: P123456789Y
                customer_name:
                  type: string
                  example: John Doe
                customer_id:
                  type: string
                  example: customer_01HC3HTDAXQ50E07CWR2A2CFBD
                trader_invoice_number:
                  type: string
                  example: '12345678901'
                payment_type_code:
                  type: string
                  example: '07'
                invoice_status_code:
                  type: string
                  example: '01'
                callback_url:
                  type: string
                  example: https://example.com/callback
                invoice_details:
                  type: string
                  example: Invoice Details
                is_tax_exempt:
                  type: boolean
                  description: Indicates if the sale is tax exempt
                  example: false
                service_charge_rate:
                  type: number
                  format: double
                  example: 0.02
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - quantity
                      - unit_price
                      - total_amount
                    properties:
                      id:
                        type: string
                        example: item_01HC3J1VVVM05YCTS61G7V3KC6
                      quantity:
                        type: number
                        example: 1
                      unit_price:
                        type: number
                        example: 3500
                      total_amount:
                        type: number
                        example: 3500
                      package_unit_quantity:
                        type: number
                        example: 1
                      discount_rate:
                        type: number
                        example: 0
                      discount_amount:
                        type: number
                        example: 0
                      item_description:
                        type: string
                        example: DigiTax Product 01
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Sales
      summary: Get sales
      description: >-
        List sales for a particular business. If an `end_date` is provided
        without a `start_date`, all sales will be returned.
      security:
        - apiKeyAuth: []
      parameters:
        - in: query
          name: start_date
          required: false
          schema:
            type: string
            description: >-
              Start date (YYYY-MM-DD) - sales returned will be inclusive of this
              date
            example: '2024-01-31'
        - in: query
          name: end_date
          required: false
          schema:
            type: string
            description: >-
              End date (YYYY-MM-DD) - sales returned will be inclusive of this
              date
            example: '2024-12-25'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sales-with-items:
    post:
      tags:
        - Sales
      summary: Add sale with item information
      description: Add sale with item information
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trader_invoice_number
                - receipt_type_code
                - payment_type_code
                - invoice_status_code
                - items
                - sale_date
              properties:
                sale_date:
                  type: string
                  example: '2023-07-23'
                customer_tin:
                  type: string
                  example: P123456789Y
                customer_name:
                  type: string
                  example: John Doe
                customer_id:
                  type: string
                  example: customer_01HC3HTDAXQ50E07CWR2A2CFBD
                trader_invoice_number:
                  type: string
                  example: '12345678901'
                receipt_type_code:
                  type: string
                  example: S
                payment_type_code:
                  type: string
                  example: '07'
                invoice_status_code:
                  type: string
                  example: '01'
                callback_url:
                  type: string
                  example: https://example.com/callback
                invoice_auth:
                  type: object
                  required:
                    - type
                    - issuer
                  properties:
                    type:
                      type: string
                      example: REVERSE
                    issuer:
                      type: string
                      example: business_01HC3J1VVVM05YCTS61G7V3KC6
                invoice_details:
                  type: string
                  example: Invoice Details
                is_tax_exempt:
                  type: boolean
                  description: Indicates if the sale is tax exempt
                  example: false
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - quantity
                      - unit_price
                      - total_amount
                      - item_name
                      - item_class_code
                      - item_bar_code
                      - item_tax_type_code
                    properties:
                      item_name:
                        type: string
                        example: Item name
                      item_class_code:
                        type: string
                        example: '99000000'
                      item_bar_code:
                        type: string
                        example: '99000001'
                      item_tax_type_code:
                        type: string
                        example: D
                      quantity:
                        type: number
                        example: 1
                      unit_price:
                        type: number
                        example: 3500
                      total_amount:
                        type: number
                        example: 3500
                      taxable_amount:
                        type: number
                        example: 3500
                      tax_amount:
                        type: number
                        example: 0
                      package_unit_quantity:
                        type: number
                        example: 1
                      discount_rate:
                        type: number
                        example: 0
                      discount_amount:
                        type: number
                        example: 0
                      item_description:
                        type: string
                        example: DigiTax Product 01
                      is_stockable:
                        type: boolean
                        description: >-
                          Indicates if the item is stockable. Stockable items
                          are treated as FINISHED goods, whereas non-stockable
                          items are treated as SERVICES.
                        example: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /credit-notes/express:
    post:
      tags:
        - Sales
      summary: Add express credit note
      description: Add express credit note
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - return_date
                - sale_id
                - trader_invoice_number
              properties:
                trader_invoice_number:
                  type: string
                  example: '12345678901'
                return_date:
                  type: string
                  example: '2023-07-23'
                sale_id:
                  type: string
                  example: sale_01HC3J1VVVM05YCTS61G7V3KC6
                callback_url:
                  type: string
                  example: https://example.com/callback
                invoice_details:
                  type: string
                  example: General Invoice Details
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /credit-notes-with-barcode:
    post:
      tags:
        - Sales
      summary: Add credit note with item bar codes
      description: Add credit note with item bar codes
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - return_date
                - sale_id
                - trader_invoice_number
              properties:
                trader_invoice_number:
                  type: string
                  example: '12345678901'
                return_date:
                  type: string
                  example: '2023-07-23'
                sale_id:
                  type: string
                  example: sale_01HC3J1VVVM05YCTS61G7V3KC6
                callback_url:
                  type: string
                  example: https://example.com/callback
                invoice_details:
                  type: string
                  example: General Invoice Details
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - item_bar_code
                      - quantity
                      - unit_price
                      - total_amount
                    properties:
                      item_bar_code:
                        type: string
                        example: HC3J1VVVM05YCTS61G7V3KC6
                      quantity:
                        type: number
                        example: 1
                      unit_price:
                        type: number
                        example: 3500
                      total_amount:
                        type: number
                        example: 3500
                      taxable_amount:
                        type: number
                        example: 3500
                      tax_amount:
                        type: number
                        example: 0
                      package_unit_quantity:
                        type: number
                        example: 1
                      discount_rate:
                        type: number
                        example: 0
                      discount_amount:
                        type: number
                        example: 0
                      item_description:
                        type: string
                        example: DigiTax Product 01
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /credit-notes:
    post:
      tags:
        - Sales
      summary: Add credit note
      description: Add credit note
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - return_date
                - sale_id
                - trader_invoice_number
              properties:
                return_date:
                  type: string
                  example: '2023-07-23'
                sale_id:
                  type: string
                  example: sale_01HC3J1VVVM05YCTS61G7V3KC6
                trader_invoice_number:
                  type: string
                  example: '12345678901'
                callback_url:
                  type: string
                  example: https://example.com/callback
                invoice_details:
                  type: string
                  example: General Invoice Details
                items:
