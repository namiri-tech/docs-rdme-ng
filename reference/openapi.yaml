                - trader_invoice_number
              properties:
                debit_date:
                  type: string
                  format: date
                  example: '2025-08-07'
                  description: >-
                    The date on which this debit note was created in the format
                    YYYY-MM-DD
                issue_date:
                  type: string
                  format: date
                  example: '2025-08-07'
                  description: >-
                    The date on which this debit note was issued in the format
                    YYYY-MM-DD
                issue_time:
                  type: string
                  format: time
                  example: '14:30:00'
                  description: >-
                    The time at which this debit note was issued in the format
                    HH:MM:SS
                tax_point_date:
                  type: string
                  format: date
                  example: '2025-08-07'
                  description: >-
                    The actual date when the tax becomes applicable in the
                    format YYYY-MM-DD
                document_currency_code:
                  type: string
                  example: NGN
                  description: >-
                    A code that specifies the default currency in which the
                    debit note is issued
                buyer_reference:
                  type: string
                  example: '#DN-001'
                  description: >-
                    A reference number or code provided by the buyer to track
                    the debit note
                trader_invoice_number:
                  type: string
                  example: '2453618203'
