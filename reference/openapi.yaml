                receipt_document_reference:
                  $ref: '#/components/schemas/InvoiceDocumentReference'
                  description: >-
                    A reference to a receipt advice associated with a debit
                    note. Links the debit note to a receipt document
                originator_document_reference:
                  $ref: '#/components/schemas/InvoiceDocumentReference'
                  description: >-
                    A reference to an originator document associated with a
                    debit note. Identifies the original document that initiated
                    the debit note
                contract_document_reference:
                  $ref: '#/components/schemas/InvoiceDocumentReference'
                  description: >-
                    A reference to a contract associated with a debit note.
                    Links the debit note to a contract governing the transaction
                additional_document_reference:
                  type: array
                  description: >-
                    A reference to additional documents associated with the
                    debit note. Used as a general reference field for any
                    related documents
                  items:
                    $ref: '#/components/schemas/InvoiceDocumentReference'
                due_date:
                  type: string
