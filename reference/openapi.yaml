    put:
      tags:
        - Invoices
      summary: Update an invoice payment status
      description: Update an invoice payment status
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: invoice_id
          required: true
          schema:
            type: string
            description: Invoice ID on DigiTax
            example: invoice_01JWR2VH5B3FC4JRXNJDQZCVE6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
