                    An invoice number assigned by the supplier to uniquely
                    identify the debit note in their system
                invoice_id:
                  type: string
                  example: invoice_01JWR2VH5B3FC4JRXNJDQZCVE6
                  description: The DigiTax ID of the invoice that is being debited
                accounting_cost:
                  type: string
                  example: 2000 NGN
                  description: >-
