          example: 10000
          description: The total amount for this item before tax
        quantity:
          type: number
          format: double
          example: 1
          description: The total number of items sold
        unit_price:
          type: number
          format: double
          example: 10000
          description: The cost of one unit of the item
        discount_rate:
          type: number
          format: double
          example: 0.05
          description: The discount rate(between 0 to 1) applied to the item
        fee_rate:
          type: number
          format: double
          example: 0.02
          description: >-
            The rate(between 0 to 1) of any additional fees (e.g. service
            charge, delivery fee) applied to the item
        discount_amount:
          type: number
          format: double
          example: 500
          description: >-
            The actual discount value in currency applied to the item based on
