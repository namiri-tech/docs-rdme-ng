                  type: string
                  format: uri
                  example: https://example.com/callback
                  description: >-
                    The URL to call when we have new information about the debit
                    note, when the invoice is signed successfully or validation
                    has failed
      responses:
        '201':
          description: APP Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APPInvoice'
        default:
          $ref: '#/components/responses/Error'
